[project]
name = "bio-inspired-foveation-in-dg3"
version = "0.1.0"
description = "Bio-inspired foveation in DeepGaze III — thesis codebase"
authors = [
    { name = "Imer Itez" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    # Cap torch at 2.5.x so the cu121 CUDA wheels remain available on Linux.
    # cu121 requires NVIDIA driver >= 530.30.02 (Feb 2023) — broadly
    # compatible with most maintained HPC clusters. The macOS resolver picks
    # the regular MPS-capable wheel from PyPI; only Linux uses cu121.
    "torch>=2.4,<2.6",
    "torchvision>=0.19,<0.21",
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    # No direct import in this repo: pysaliency imports h5py lazily to read
    # stimuli.hdf5 / fixations.hdf5 but does not declare it, so this line is
    # the only thing that installs it. Removing it breaks MIT1003 loading.
    "h5py>=3.10",
    "pysaliency>=0.2.22",
    "deepgaze-pytorch",
    # No direct import here either: deepgaze_pytorch imports clip and einops
    # on its own import path. Both are reachable only through it. clip also
    # pulls ftfy and regex transitively, so those need no separate line.
    "clip",
    "einops>=0.7",
]

# Dependency group (PEP 735): a bare `uv sync` installs it, so pytest and ruff
# come with the default install.
[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "ipython>=8.20",
    "jupyter>=1.0",
]

[project.scripts]
tez-cv-split = "tez_deepgaze.cv_split:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

# uv_build derives the source directory from the project name. The
# distribution is named after the repository; the importable package keeps
# its own name, so the backend is pointed at it explicitly.
[tool.uv.build-backend]
module-name = "tez_deepgaze"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
deepgaze-pytorch = { git = "https://github.com/matthias-k/DeepGaze.git" }
clip = { git = "https://github.com/openai/CLIP.git" }
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "heavy: loads the MIT1003 corpus and/or pretrained DG3 weights — run via scripts/slurm/pytest.sbatch on gpu2, not on the laptop (deselect with -m 'not heavy')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
